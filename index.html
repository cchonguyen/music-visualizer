<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Visualizer</title>
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="Audio visualizer. The visuals react to the music and carry no information that isn't in the sound."></canvas>

    <section id="start" class="overlay">
      <h1>Music Visualizer</h1>
      <p class="warn"><strong>Photosensitivity note:</strong> visuals pulse with the music. Flashes are kept under 3 per second, and you can turn motion down at any time with the Calm switch.</p>
      <button id="start-btn" type="button" class="primary">Start</button>
      <p class="hint">Desktop Chrome or Edge recommended.</p>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="studio" class="studio" aria-label="Preset Studio" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <nav id="controls" class="controls" aria-label="Player controls" hidden>
      <div class="group" role="group" aria-label="Audio source">
        <button type="button" id="file-btn" class="btn">File…</button>
        <input id="file-input" type="file" accept=".mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.webm,audio/mpeg,audio/mp4,audio/wav,audio/flac,audio/ogg" hidden />
        <button type="button" data-source="display">Tab / system audio</button>
        <button type="button" data-source="mic">Microphone</button>
        <select id="test-select" aria-label="Test signal">
          <option value="">Test signal…</option>
          <option value="kick">Kick (60 Hz, every 0.5 s)</option>
          <option value="tone">Tone (2 kHz)</option>
          <option value="sweep">Sweep (40 Hz – 8 kHz)</option>
          <option value="silence">Silence</option>
        </select>
        <button type="button" data-source="stop">Stop</button>
      </div>
      <div class="group" role="group" aria-label="Playback" id="playback">
        <button type="button" id="play-btn" aria-label="Pause (Space)">Pause</button>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <span id="time" class="time">0:00</span>
      </div>
      <div class="group" role="group" aria-label="Output">
        <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
        <label class="switch"><input id="calm" type="checkbox" /> Calm</label>
        <label>Visual gain <input id="gain" type="range" min="0.5" max="3" step="0.05" value="1" /> <span id="gain-value">1.00×</span></label>
        <button type="button" id="fs-btn" aria-label="Fullscreen (F)">Fullscreen</button>
      </div>
      <span id="source-label" class="source" aria-live="polite">No source</span>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
