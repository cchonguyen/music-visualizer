# Harness Referee watch (spoke template). Copy to .github/workflows/harness-referee-watch.yml in a spoke.
# On every push to main, lists the non-merge commits that carry no Referee-Verdict trailer.
# If any exist, it opens one issue naming them. It never reverts or blocks anything.
name: Harness Referee watch

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find commits without a Referee trailer
        id: scan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set +e
          node .harness/scripts/ci-gate.mjs push "$BEFORE" "$AFTER" > "$RUNNER_TEMP/unverified.txt"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show the scan result
        run: cat "$RUNNER_TEMP/unverified.txt"

      - name: Open an issue for unverified commits
        # Only exit 1 (new commits without a trailer) opens an issue. Exit 2 (scan could not run) does not.
        if: steps.scan.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "Commits on main without a Referee-Verdict trailer, pushed at $SHA:"
            echo
            cat "$RUNNER_TEMP/unverified.txt"
            echo
            echo "Work on main should go through a slice (finish-slice.mjs stamps the trailers). Check whether the commit was a hand edit or a merge from a branch without a slice."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Commit without Referee trailer on main at ${SHA:0:7}" --body-file "$RUNNER_TEMP/issue.md"
