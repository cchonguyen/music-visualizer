# Harness gate (spoke caller). Copy to .github/workflows/harness-slice-gate.yml in a spoke.
# It calls the one gate in the public hub (cchonguyen/claude-harness-hub, .github/workflows/harness-gate.yml)
# at @main. It links a missing issue and checks for duplicate slice ids. No other copy of the gate script is needed.
# Make the check "Harness gate / Harness gate" a required check in the repo's branch protection.
name: Harness gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    name: Harness gate
    uses: cchonguyen/claude-harness-hub/.github/workflows/harness-gate.yml@main
